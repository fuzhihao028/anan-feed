<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FCEBE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安安喂养台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>安安喂养台</title>
<style>
  :root{
    --bg:#FDF9F4; --card:#FFFFFF; --ink:#3E2A1C; --muted:#8A7462; --line:#F0E4D6;
    --accent:#D85A30; --accent-soft:#FCEBE2; --good:#0F6E56; --good-soft:#E1F5EE;
    --warn:#BA7517; --warn-soft:#FAEEDA; --bad:#A32D2D; --bad-soft:#FCEBEB;
    --pink:#993556; --pink-soft:#FBEAF0; --teal:#0F6E56; --teal-soft:#E1F5EE;
    --radius:14px; --shadow:0 3px 14px rgba(74,42,12,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px;padding-bottom:76px;}
  header{background:linear-gradient(120deg,#F6CDB6,#F3DCC8);padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(74,42,12,.08);}
  .hrow{display:flex;align-items:center;gap:12px;}
  .avatar{width:46px;height:46px;border-radius:50%;background:#F5C4B3;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
  .htxt{flex:1;min-width:0;}
  .htxt h1{margin:0;font-size:18px;font-weight:600;color:#712B13;}
  .htxt p{margin:1px 0 0;font-size:12px;color:#993C1D;}
  .gear{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.65);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .vacstrip{margin-top:10px;background:#fff;border-radius:11px;padding:9px 12px;font-size:12.5px;color:#444;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .vacstrip b{color:var(--accent);}
  main{max-width:520px;margin:0 auto;padding:14px 14px 20px;}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px;}
  .card h2{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .card h2 .more{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400;cursor:pointer;}
  .muted{color:var(--muted);font-size:12.5px;}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .qbtn{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 2px;text-align:center;cursor:pointer;box-shadow:var(--shadow);}
  .qbtn:active{background:var(--accent-soft);}
  .qbtn .ic{font-size:21px;}
  .qbtn p{margin:3px 0 0;font-size:12px;color:#5A4636;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .stat{background:var(--accent-soft);border-radius:11px;padding:9px 6px;text-align:center;}
  .stat:nth-child(2){background:var(--good-soft);}
  .stat:nth-child(3){background:var(--pink-soft);}
  .stat:nth-child(4){background:var(--warn-soft);}
  .stat .lb{font-size:11px;color:#7A5C3A;}
  .stat .v{font-size:19px;font-weight:600;color:#5A3A1E;margin-top:1px;}
  .stat .s{font-size:10.5px;color:var(--muted);}
  .rowbtn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .rowbtn button{border:1px dashed #E4CBAF;background:#FFFDF9;border-radius:10px;padding:7px 2px;font-size:12px;color:#8A6A45;cursor:pointer;}
  .daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .daynav button{width:36px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:#7A5C3A;}
  .daynav .d{font-size:15px;font-weight:600;}
  .chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;}
  .chip{flex-shrink:0;font-size:11.5px;padding:4px 10px;border-radius:20px;background:#fff;border:1px solid var(--line);color:#7A5C3A;}
  .tl{list-style:none;margin:0;padding:0;}
  .tl li{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);align-items:flex-start;}
  .tl li:last-child{border-bottom:0;}
  .tl .ic{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
  .tl .bd{flex:1;min-width:0;}
  .tl .tt{font-size:13.5px;}
  .tl .tm{font-size:11px;color:var(--muted);}
  .tl .del{border:0;background:none;color:#D8C3A8;font-size:13px;cursor:pointer;padding:2px 4px;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0;}
  .adv{background:#FFF9F1;border:1px solid #F2E1C4;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:6px;color:#7A5A2E;}
  .adv b{color:#8A5A1E;}
  .banner{border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start;}
  .bn-warn{background:var(--warn-soft);color:#7A4E0E;border:1px solid #EFDCB2;}
  .bn-bad{background:var(--bad-soft);color:#7A1F1F;border:1px solid #F2C9C9;}
  .bn-good{background:var(--good-soft);color:#085041;border:1px solid #C4E8DA;}
  .vacitem{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);}
  .vacitem:last-child{border-bottom:0;}
  .vdate{width:74px;flex-shrink:0;text-align:center;}
  .vdate .dd{font-size:14px;font-weight:600;}
  .vdate .dm{font-size:10.5px;color:var(--muted);}
  .vbd{flex:1;}
  .vbd .vn{font-size:13.5px;}
  .vbd .vs{font-size:11px;color:var(--muted);}
  .vacitem.done .vn{color:var(--muted);text-decoration:line-through;}
  .vbtn{border:0;border-radius:9px;padding:6px 11px;font-size:12px;cursor:pointer;background:var(--accent-soft);color:var(--accent);flex-shrink:0;}
  .vbtn.done{background:var(--good-soft);color:var(--good);}
  .selffee{font-size:12.5px;color:#7A5C3A;}
  .selffee li{margin-bottom:5px;}
  .ck{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:5px 0;}
  .ck input{margin-top:3px;}
  .tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 4px calc(env(safe-area-inset-bottom) + 8px);z-index:30;max-width:520px;margin:0 auto;}
  .tabs button{border:0;background:none;cursor:pointer;text-align:center;color:#A08A72;}
  .tabs button .i{font-size:19px;}
  .tabs button p{margin:1px 0 0;font-size:10.5px;}
  .tabs button.active{color:var(--accent);font-weight:600;}
  .overlay{position:fixed;inset:0;background:rgba(50,30,15,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;}
  .sheet{background:#FDF9F4;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:86vh;overflow-y:auto;}
  .sheet h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;}
  .sheet h3 .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;padding:2px 6px;}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 2px;font-size:13px;cursor:pointer;color:#5A4636;}
  .seg button.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}
  .seg2{grid-template-columns:repeat(4,1fr);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit;}
  .field textarea{height:64px;resize:none;}
  .savebtn{width:100%;border:0;border-radius:12px;padding:13px;font-size:15.5px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;}
  .savebtn:active{opacity:.85;}
  .tagwrap{display:flex;flex-wrap:wrap;gap:7px;}
  .tagwrap button{border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:#5A4636;}
  .tagwrap button.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:0;}
  .kv b{font-weight:600;}
  .btn2{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:13.5px;cursor:pointer;color:#5A4636;width:100%;}
  .btn2.danger{color:var(--bad);}
  .btn2 + .btn2{margin-top:8px;}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(62,42,28,.92);color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;z-index:99;display:none;}
  .sectitle{font-size:13px;font-weight:600;color:#8A6A45;margin:14px 0 8px;}
  .installbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 74px);max-width:496px;margin:0 auto;background:#fff;border:1px solid var(--line);box-shadow:0 6px 22px rgba(74,42,12,.16);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:40;}
  .installbar.show{display:flex;}
  .installbar .ico{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .installbar .txt{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:1.4;}
  .installbar .txt b{display:block;font-size:13.5px;color:var(--ink);}
  .installbar .go{border:0;background:var(--accent);color:#fff;font-size:13px;padding:7px 13px;border-radius:10px;font-weight:600;cursor:pointer;flex-shrink:0;}
  .installbar .x{border:0;background:none;color:#B9A593;font-size:16px;padding:0 2px;cursor:pointer;flex-shrink:0;}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="avatar">👶</div>
    <div class="htxt">
      <h1>安安的喂养台</h1>
      <p id="ageLine"></p>
    </div>
    <button class="gear" onclick="openSettings()">⚙️</button>
  </div>
  <div class="vacstrip" onclick="switchTab('vacc')">💉 <span id="vacHint"></span></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-t="today" class="active" onclick="switchTab('today')"><div class="i">🏠</div><p>今日</p></button>
  <button data-t="log" onclick="switchTab('log')"><div class="i">📋</div><p>记录</p></button>
  <button data-t="vacc" onclick="switchTab('vacc')"><div class="i">💉</div><p>疫苗</p></button>
</nav>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="installbar" id="installbar">
  <div class="ico">📲</div>
  <div class="txt"><b>装成 App 用到桌面</b>图标一键打开，断网也能记</div>
  <button class="go" onclick="doInstall()">立即安装</button>
  <button class="x" onclick="hideInstall()">✕</button>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= 基础数据 ================= */
const BIRTH = new Date(2026,9,26,14,0,0);          // 2026-10-26 下午
const KEY = 'anan_feeding_v1';

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
let S = load();
if(!S){
  // 首次使用：预填基线
  const base = Date.UTC(2026,10,13) - 8*3600e3; // 2026-11-13
  S = { records:[
    {id:1,ts:base,t:'weight',d:{v:3640,note:'月子中心称重基线'}},
    {id:3,ts:base,t:'note',d:{txt:'混合喂养：母乳（亲喂+瓶喂）+ 奶粉150-200ml/天；每天补D3 400IU'}}
  ], vacc:{0:{done:true,note:'出生时已接种（默认勾选，可修改）'}}, mood:{} };
  save();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

/* 通过链接灌数据：#data=<base64(json)>  —— 打开一次即自动合并进本机 */
function applyHashData(){
  var m=location.hash.match(/^#data=(.+)$/);
  if(!m)return;
  try{
    var b64=m[1].replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4)b64+='=';
    var bin=atob(b64);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    var json=JSON.parse(new TextDecoder('utf-8').decode(bytes));
    var arr=Array.isArray(json)?json:(json.records||[]);
    var added=0;
    arr.forEach(function(r){
      if(!r||!r.ts||!r.t)return;
      var dup=S.records.some(function(x){return x.ts===r.ts&&x.t===r.t;});
      if(!dup){S.records.push({id:uid(),ts:r.ts,t:r.t,d:r.d||{}});added++;}
    });
    if(json&&json.vacc){Object.keys(json.vacc).forEach(function(k){S.vacc[k]=json.vacc[k];});}
    save();
    history.replaceState(null,'',location.pathname);
    setTimeout(function(){toast('已从链接导入 '+added+' 条记录 ✓');},350);
  }catch(e){}
}

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pad(n){return (n<10?'0':'')+n;}
function dayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtT(ts){const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtD(ts){const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function ageDays(ts){const t=ts||Date.now();return Math.floor((t-BIRTH.getTime())/864e5);}
function daysUntil(ts){return Math.ceil((ts-Date.now())/864e5);}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1600);}
function uid(){return Date.now()+''+Math.floor(Math.random()*999);}
function addRec(t,d,ts){S.records.push({id:uid(),ts:ts||Date.now(),t:t,d:d});save();render();toast('已记录 ✓');}
function delRec(id){S.records=S.records.filter(r=>r.id!==id);save();render();}

const records=()=>S.records.slice().sort((a,b)=>b.ts-a.ts);
const recsOf=(day,type)=>records().filter(r=>dayKey(r.ts)===day&&(!type||r.t===type));
function latestOf(type,beforeTs){return records().find(r=>r.t===type&&(!beforeTs||r.ts<=beforeTs));}

/* ================= 疫苗计划 ================= */
const VACC=[
  {n:'乙肝疫苗第1针 + 卡介苗',off:0},
  {n:'乙肝疫苗第2针',off:30},
  {n:'脊灰灭活疫苗（IPV）第1针',off:60},
  {n:'IPV第2针 + 百白破第1针',off:90},
  {n:'IPV第3针 + 百白破第2针',off:120},
  {n:'百白破第3针',off:150},
  {n:'乙肝疫苗第3针 + 流脑A群多糖第1针',off:180},
  {n:'麻腮风第1针 + 乙脑减毒活疫苗第1针',off:240}
];
const SELFVACC=[
  '五联疫苗（2月龄起）：替代IPV+百白破+Hib，从十几针减到4针，可咨询社区',
  '13价肺炎球菌疫苗（2月龄起）：建议接种',
  '口服轮状疫苗（2月龄起，窗口期严格，错过要等一年）',
  '手足口EV71疫苗（6月龄起）',
  '流感疫苗（6月龄起，每年接种）'
];
function vacDate(off){const d=new Date(BIRTH.getTime()+off*864e5);return d;}
function nextVac(){
  for(let i=0;i<VACC.length;i++){
    const st=S.vacc[i];
    if(!(st&&st.done)){
      const dt=vacDate(VACC[i].off);
      return {i,days:daysUntil(dt),date:dt,late:dt<Date.now()};
    }
  }
  return null;
}
function toggleVac(i,el){
  if(S.vacc[i]&&S.vacc[i].done){delete S.vacc[i];}
  else{S.vacc[i]={done:true};}
  save();render();
}

/* ================= 今日页 ================= */
/* ================= 睡眠 ================= */
function openSleep(){          // 没有进行中的睡眠 → 开始；有 → 结束
  const open=records().find(r=>r.t==='sleep'&&r.d.start&&!r.d.end);
  if(open){
    open.d.end=Date.now();
    save();render();
    toast('醒了 ✓ 本次睡 '+fmtDur(Date.now()-open.d.start));
  }else{
    addRec('sleep',{start:Date.now()});
    toast('开始记录睡眠 💤');
  }
}
function fmtDur(ms){const m=Math.round(ms/6e4);return Math.floor(m/60)+' 时 '+m%60+' 分';}
function sleepMinutesDay(dk){ // 某天完成的睡眠总分钟
  let m=0;
  S.records.forEach(r=>{
    if(r.t!=='sleep'||!r.d.start||!r.d.end)return;
    if(dayKey(r.d.start)!==dk)return;
    m+=Math.max(0,(r.d.end-r.d.start))/6e4;
  });
  return Math.round(m);
}
function sleepingNow(){
  return records().find(r=>r.t==='sleep'&&r.d.start&&!r.d.end)||null;
}

function statToday(){
  const dk=dayKey(Date.now());
  const feeds=recsOf(dk,'feed');
  let bf=0,ff=0,bfMin=0,bfMl=0,ffMl=0;
  feeds.forEach(r=>{if(r.d.mode==='formula'){ff++;ffMl+=+r.d.ml||0;}else if(r.d.mode==='bf-bottle'){bfMl+=+r.d.ml||0;}else{bf++;bfMin+=+r.d.min||0;}});
  return {feeds:feeds.length,ffMl,bfMl,bfMin,
    totalMl:ffMl+bfMl,
    sleepMin:sleepMinutesDay(dk),
    wet:recsOf(dk,'diaper').filter(r=>r.d.wet).length,
    stool:recsOf(dk,'diaper').filter(r=>r.d.stool).length};
}
function viewToday(){
  const st=statToday();
  const vdToday=recsOf(dayKey(Date.now()),'vitd').length>0;
  const lastW=latestOf('weight');
  const slp=sleepingNow();
  // 体重周增
  let wGain='';
  if(lastW){
    const prev=records().filter(r=>r.t==='weight'&&r.ts<lastW.ts).sort((a,b)=>b.ts-a.ts)[0];
    if(prev){
      const days=Math.max(1,Math.round((lastW.ts-prev.ts)/864e5));
      const per=Math.round((lastW.d.v-prev.d.v)/days*7);
      wGain=' · 7天'+(per>=0?'+':'')+per+'g';
    }
  }
  // 妈妈检查倒计时（过完自动淡化）
  const cd=daysUntil(new Date(2026,11,7));
  const momLine=cd>0?`<div class="vacstrip" style="margin-top:0;">👩 42天产后检查 <b>12月7日 · 还有 ${cd} 天</b></div>`:
    (cd>=-7?'<div class="vacstrip" style="margin-top:0;">👩 42天产后检查已到期，尽快预约（B超/盆底肌/伤口 + 安安体检）</div>':'');
  const sleepV=slp?'睡觉中 · '+fmtDur(Date.now()-slp.start):(Math.floor(st.sleepMin/60)+'h'+(st.sleepMin%60?st.sleepMin%60+'m':''));
  return `
  <div class="quick">
    <div class="qbtn" onclick="openFeed()"><div class="ic">🍼</div><p>记喂奶</p></div>
    <div class="qbtn" onclick="openSleep()"><div class="ic">😴</div><p>${slp?'睡醒了':'睡觉了'}</p></div>
    <div class="qbtn" onclick="openDiaper()"><div class="ic">🧷</div><p>换尿布</p></div>
    <div class="qbtn" onclick="openWeight()"><div class="ic">⚖️</div><p>称体重</p></div>
  </div>
  <div class="card" style="padding:12px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="flex:1;">
        <div style="font-size:14px;font-weight:600;">💧 维生素 D3 每日打卡</div>

const ICONS={feed:'🍼',diaper:'🧷',sleep:'😴',cry:'😭',temp:'🌡️',jaun:'🟡',weight:'⚖️',spit:'🤮',skin:'🩹',med:'💊',vitd:'💧',mood:'😀',note:'📝'};
function recLine(r){
  const d=r.d;
  if(r.t==='feed'){
    let m;
    if(d.mode==='formula')m='奶粉 '+d.ml+' ml';
    else if(d.mode==='bf-bottle')m='瓶喂母乳 '+d.ml+' ml';
    else m='亲喂 '+(d.min?d.min+' 分钟':'');
    return m+(d.note?' · '+esc(d.note):'');
  }
  if(r.t==='diaper'){
    const parts=[];
    if(d.wet)parts.push('尿 ✓');
    if(d.stool)parts.push('便 ✓'+(d.color?' '+d.color:'')+(d.tex?' '+d.tex:''));
    return parts.join(' · ')||'尿布检查';
  }
  if(r.t==='sleep'){
    if(!d.end)return '睡觉中…';
    return '睡眠 '+fmtDur(d.end-d.start)+(d.note?' · '+esc(d.note):'');
  }
  if(r.t==='cry')return '哭闹（旧记录）';
  if(r.t==='temp')return '体温 '+d.v+' ℃';
  if(r.t==='jaun')return '黄疸（经皮）'+d.v+(d.note?' · '+esc(d.note):'');
  if(r.t==='weight')return '体重 '+d.v+' g';
  if(r.t==='spit')return '吐奶/呛奶：'+esc(d.v)+(d.note?' · '+esc(d.note):'');
  if(r.t==='skin')return '皮肤（'+esc(d.kind)+'）：'+esc(d.note||'');
  if(r.t==='med')return '就医/用药：'+esc(d.note);
  if(r.t==='vitd')return '维生素D3 已补 ✓';
  if(r.t==='mood')return '妈妈情绪打卡 '+['😞','😕','😐','🙂','😊'][d.v-1];
  if(r.t==='note')return esc(d.txt);
  return '';
}
function svgLine(pts,unit,warn){
  if(pts.length<2)return '<div class="empty" style="padding:12px 0;">再记一次就能画趋势线啦</div>';
  const W=300,H=90,P=8;
  const vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rng=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>P+(1-(v-mn)/rng)*(H-2*P);
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  let warnLine='';
  if(warn!=null&&warn>=mn&&warn<=mx)warnLine=`<line x1="${P}" y1="${y(warn)}" x2="${W-P}" y2="${y(warn)}" stroke="#A32D2D" stroke-width="0.7" stroke-dasharray="3,3"/><text x="${W-P}" y="${y(warn)-3}" font-size="8" fill="#A32D2D" text-anchor="end">${warn}${unit}</text>`;
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.4" fill="#D85A30"/>`).join('');
  const labels=`<text x="${P}" y="${H-1}" font-size="8" fill="#8A7462">${pts[0].d}</text><text x="${W-P}" y="${H-1}" font-size="8" fill="#8A7462" text-anchor="end">${pts[pts.length-1].d}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#FFFDF9;border-radius:9px;">${warnLine}<path d="${path}" fill="none" stroke="#D85A30" stroke-width="1.6"/>${dots}${labels}</svg>`;
}
function chartFor(type,unit,warn){
  const arr=records().filter(r=>r.t===type).sort((a,b)=>a.ts-b.ts)
    .map(r=>({v:+r.d.v,d:(new Date(r.ts)).getMonth()+1+'/'+(new Date(r.ts)).getDate()}));
  return svgLine(arr,unit,warn);
}

function sheet(html){$('#sheet').innerHTML=html;$('#overlay').classList.add('show');}
function closeSheet(){$('#overlay').classList.remove('show');}
function seg(id,opts,sel){
  return `<div class="seg" id="${id}">${opts.map((o,i)=>`<button class="${i===(sel||0)?'sel':''}" data-v="${o.v}" onclick="segSel('${id}',this)">${o.t}</button>`).join('')}</div>`;
}
function segSel(id,el){[...el.parentNode.children].forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
function segVal(id){const b=$('#'+id).querySelector('.sel');return b?b.dataset.v:null;}

function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='安安喂养台备份-'+dayKey(Date.now())+'.json';a.click();

function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.records)throw 0;S=d;save();render();closeSheet();toast('导入成功 ✓');}catch(err){toast('文件不对，导入失败');}};
  r.readAsText(f);
}

/* ===== 安卓 / PWA 安装 ===== */
var _installEvt=null;
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone===true
    || document.referrer.indexOf('android-app://')===0;
}
function showInstall(){var b=$('#installbar');if(b&&!isStandalone()&&!localStorage.getItem('install_off'))b.classList.add('show');}
function hideInstall(){localStorage.setItem('install_off','1');var b=$('#installbar');if(b)b.classList.remove('show');}
function doInstall(){
  if(_installEvt){_installEvt.prompt();_installEvt.userChoice.then(function(){_installEvt=null;hideInstall();});return;}
  if(/Android/i.test(navigator.userAgent)){toast('点右上角 ⋮ → 安装应用 / 添加到主屏幕');}
  else{toast('Safari：分享 → 添加到主屏幕');}
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_installEvt=e;showInstall();});
window.addEventListener('appinstalled',function(){hideInstall();toast('已装到桌面 ✓');});
window.addEventListener('load',function(){
  setTimeout(function(){
    // 安卓 Chrome 若不触发 beforeinstallprompt（如国内浏览器内核），给手动指引
    if(!_installEvt && /Android/i.test(navigator.userAgent)) showInstall();
    else if(_installEvt) showInstall();
  },2500);
});
applyHashData();
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
